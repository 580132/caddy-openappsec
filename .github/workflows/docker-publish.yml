name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (caddy)
        id: meta-caddy
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/580132/caddy-openappsec
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata (mockengine)
        id: meta-mockengine
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/580132/caddy-openappsec-mockengine
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: caddy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-caddy.outputs.tags }}
          labels: ${{ steps.meta-caddy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (mockengine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: mockengine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-mockengine.outputs.tags }}
          labels: ${{ steps.meta-mockengine.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR container packages are private by default; publish them so the
      # images are pullable without credentials.
      - name: Make images public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "user/packages/container/caddy-openappsec" -f visibility=public
          gh api -X POST "user/packages/container/caddy-openappsec-mockengine" -f visibility=public
